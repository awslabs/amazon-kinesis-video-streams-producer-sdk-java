matrix:
  platform:
    - os: macos-15-intel
      name: macos-x86_64
    - os: macos-latest
      name: macos-aarch64
    - os: ubuntu-22.04
      name: ubuntu-22.04
    - os: windows-2022
      name: windows-2022
  java:
    - 11
    # JDK 21 is the current LTS most customers run (classical TLS 1.3), so it
    # runs the full matrix: unit, integration and samples. It has the
    # SSLParameters.setNamedGroups API but no ML-KEM, so it runs the
    # classical-fallback referee tests and their constraint control but skips
    # the PQC assertions. JDK 11 has no named-group API (both skip); JDK 27
    # runs the fallback tests too, plus the PQC assertions.
    - 21
    # JDK 27+ is where post-quantum TLS key exchange comes from (JEP 527).
    # Running the suite on 27 guards the runtime that PQC customers will use.
    - 27
  sample:
    - name: DemoAppMain
      expected_mkv_files: 1
    - name: DemoAppCachedInfo
      expected_mkv_files: 2
    - name: DemoAppMainWithHeapTracking
      expected_mkv_files: 1

